name: Nymcard
description: >-
  NymCard is a MENA-based, full-stack payments infrastructure provider whose nCore
  platform gives banks, fintechs and enterprises RESTful APIs to launch and manage
  card programs. nCore covers card issuing (virtual, physical, prepaid, debit,
  credit and tokenized cards), user KYC/KYB onboarding, funding and transfers,
  product management (balance and velocity limits, fees, MCC authorization
  controls), the full transaction lifecycle, 3D Secure, PCI-compliant PAN
  handling, webhooks and embedded lending. The platform is PCI DSS Level 1
  certified and NymCard is a principal member of both Visa and Mastercard, with
  offices in London and Dubai. Backed by QED Investors.
